name: ci-11

on:
  push:
    paths:
      - "11/**"
      - ".github/workflows/ci-11.yml"
  pull_request:
    paths:
      - "11/**"
      - ".github/workflows/ci-11.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r dev_requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
