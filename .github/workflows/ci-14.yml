name: ci-14

on:
  push:
    paths:
      - "14/**"
      - ".github/workflows/ci-14.yml"
  pull_request:
    paths:
      - "14/**"
      - ".github/workflows/ci-14.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
